<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>植物细胞之城 Plant Cell City</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0d1a14;
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;}
  #game{display:block;position:fixed;inset:0;cursor:pointer}

  /* ---------- 通用遮罩 ---------- */
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    z-index:50;padding:20px;overflow-y:auto}
  .hidden{display:none !important}

  /* ---------- 语言选择开场 ---------- */
  #langScreen{background:radial-gradient(circle at 50% 40%,#1d3b2c 0%,#0d1a14 70%)}
  #langScreen .panel{text-align:center;max-width:640px;width:100%;animation:pop .5s ease}
  @keyframes pop{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
  #langScreen h1{font-size:clamp(28px,6vw,46px);margin:0 0 6px;color:#c8f2d0;letter-spacing:2px;
    text-shadow:0 0 22px rgba(110,230,150,.45)}
  #langScreen h2{font-size:clamp(14px,2.6vw,19px);margin:0 0 6px;color:#7fc99a;font-weight:500;letter-spacing:3px}
  #langScreen p.sub{color:#8fb8a2;font-size:14px;margin:16px 0 30px;line-height:1.7}
  .langBtns{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
  .langBtn{cursor:pointer;border:2px solid rgba(126,220,160,.45);background:rgba(30,70,50,.55);
    color:#d3ffe0;border-radius:18px;padding:20px 40px;font-size:20px;font-weight:600;
    display:flex;flex-direction:column;align-items:center;gap:8px;min-width:150px;
    transition:.22s;font-family:inherit;backdrop-filter:blur(4px)}
  .langBtn .flag{font-size:34px;line-height:1}
  .langBtn:hover{transform:translateY(-5px) scale(1.05);background:rgba(48,110,76,.8);
    border-color:#7ee0a0;box-shadow:0 12px 34px rgba(60,200,120,.3)}
  .langBtn small{font-size:11px;font-weight:400;opacity:.7;letter-spacing:1px}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:20}
  #checklist{position:absolute;top:14px;left:14px;background:rgba(10,26,19,.86);
    border:1px solid rgba(120,220,160,.32);border-radius:14px;padding:12px 14px;min-width:214px;
    color:#d6f5e0;backdrop-filter:blur(7px);box-shadow:0 8px 26px rgba(0,0,0,.4);pointer-events:auto;
    font-size:13px}
  #checklist .clTitle{font-weight:700;font-size:13px;color:#9be8b6;margin-bottom:8px;
    display:flex;justify-content:space-between;align-items:center;gap:10px}
  #clCount{font-size:12px;background:rgba(90,200,140,.2);border-radius:20px;padding:2px 9px;color:#a8f0c4}
  #clBarWrap{height:6px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;margin-bottom:9px}
  #clBar{height:100%;width:0%;border-radius:4px;background:linear-gradient(90deg,#4fd18b,#a5f3c4);transition:width .4s}
  .clItem{display:flex;align-items:center;gap:7px;padding:2.5px 0;opacity:.45;transition:.3s;font-size:12.5px}
  .clItem.on{opacity:1}
  .clItem .tick{width:15px;text-align:center;font-size:11px}
  #langBtn{position:absolute;top:14px;right:14px;pointer-events:auto;cursor:pointer;
    background:rgba(10,26,19,.86);border:1px solid rgba(120,220,160,.4);color:#c9f5d9;
    border-radius:12px;padding:9px 16px;font-size:14px;font-weight:600;font-family:inherit;
    transition:.2s;backdrop-filter:blur(7px)}
  #langBtn:hover{background:rgba(45,110,78,.9);border-color:#7ee0a0}
  #moveHint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
    color:#8dc9a6;font-size:12.5px;background:rgba(10,26,19,.7);padding:7px 16px;border-radius:20px;
    border:1px solid rgba(120,220,160,.2);white-space:nowrap}

  /* ---------- 交互提示 ---------- */
  #prompt{position:fixed;left:50%;bottom:76px;transform:translate(-50%,20px);z-index:30;
    background:rgba(12,32,23,.94);border:2px solid #6ee09b;color:#e2ffec;padding:11px 24px;
    border-radius:14px;font-size:15px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;
    box-shadow:0 0 26px rgba(90,225,150,.35);white-space:nowrap}
  #prompt.on{opacity:1;transform:translate(-50%,0)}
  #prompt kbd{background:#6ee09b;color:#06210f;border-radius:6px;padding:1px 8px;font-family:inherit;
    font-size:13px;margin:0 2px}

  /* ---------- 讲解卡片 ---------- */
  #cardOverlay{background:rgba(4,12,8,.78);backdrop-filter:blur(6px)}
  #card{width:100%;max-width:700px;max-height:88vh;overflow-y:auto;background:#f7fbf8;
    border-radius:22px;box-shadow:0 26px 70px rgba(0,0,0,.6);animation:pop .3s ease;
    border:1px solid rgba(110,200,150,.5)}
  #cardHead{position:sticky;top:0;background:linear-gradient(135deg,#1f4d36,#2f7d4d);
    color:#eafff2;padding:20px 24px 18px;border-radius:22px 22px 0 0;z-index:2}
  #cardHead .row{display:flex;align-items:center;gap:12px}
  #cardEmoji{font-size:34px;line-height:1}
  #cardName{font-size:23px;font-weight:700;letter-spacing:.5px}
  #cardTag{font-size:13px;opacity:.85;margin-top:3px;font-style:italic}
  #cardClose{position:absolute;top:14px;right:16px;cursor:pointer;background:rgba(255,255,255,.16);
    border:none;color:#fff;width:32px;height:32px;border-radius:50%;font-size:17px;line-height:1;
    font-family:inherit;transition:.2s}
  #cardClose:hover{background:rgba(255,255,255,.34);transform:rotate(90deg)}
  #cardBody{padding:20px 24px 24px}
  .sec{margin-bottom:20px}
  .sec h4{margin:0 0 8px;font-size:13px;letter-spacing:1.4px;text-transform:uppercase;
    color:#2f7d4d;display:flex;align-items:center;gap:7px;font-weight:700}
  .sec p{margin:0;font-size:15px;line-height:1.82;color:#22332a}
  .sec ul{margin:0;padding-left:20px}
  .sec li{font-size:14.5px;line-height:1.8;color:#22332a;margin-bottom:5px}
  .whyBox{background:#eef7f1;border-left:4px solid #4fc98a;border-radius:0 12px 12px 0;
    padding:13px 16px;font-size:15px;line-height:1.8;color:#1f3a2b}
  .funcBox{background:#fff;border:1px solid #dbe9e1;border-radius:12px;padding:15px 17px}
  #diagram{display:block;margin:0 auto;max-width:100%;max-height:360px;border:1px solid #d7e4dc;border-radius:12px;background:#fff}
  #quizQ{font-size:15px;font-weight:600;color:#1f3a2b;margin:0 0 10px;line-height:1.6}
  .quizOpt{display:block;width:100%;text-align:left;cursor:pointer;background:#fff;border:1.5px solid #d3e0d8;border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:14.5px;color:#2a3a30;transition:.15s;font-family:inherit}
  .quizOpt:hover{border-color:#4fc98a;background:#f2faf5}
  .quizOpt.correct{border-color:#2f9e57;background:#d9f2e2;color:#14532d}
  .quizOpt.wrong{border-color:#d63a3a;background:#fde3e3;color:#7f1d1d}
  .quizOpt.disabled{pointer-events:none;opacity:.85}
  #quizFeedback{font-size:13.5px;line-height:1.7;margin-top:10px;padding:11px 13px;border-radius:10px;display:none}
  #quizFeedback.correct{display:block;background:#d9f2e2;color:#14532d}
  #quizFeedback.wrong{display:block;background:#fde3e3;color:#7f1d1d}
  #cardLink{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;
    background:linear-gradient(135deg,#e63946,#c1121f);color:#fff;border-radius:13px;
    padding:14px 20px;font-size:15.5px;font-weight:700;transition:.22s;
    box-shadow:0 6px 18px rgba(200,40,60,.32)}
  #cardLink:hover{transform:translateY(-2px);box-shadow:0 11px 26px rgba(200,40,60,.45)}
  .extNote{font-size:11.5px;color:#7c8f85;text-align:center;margin-top:8px}

  /* ---------- 通关 ---------- */
  #completeScreen{background:rgba(4,12,8,.85);backdrop-filter:blur(7px)}
  #completeScreen .panel{text-align:center;background:linear-gradient(150deg,#1f4d36,#123324);
    border:2px solid #6ee09b;border-radius:24px;padding:44px 40px;max-width:520px;
    box-shadow:0 0 70px rgba(90,225,150,.35);animation:pop .45s ease}
  #completeScreen h2{color:#c8ffdd;font-size:clamp(20px,4.4vw,28px);margin:0 0 14px}
  #completeScreen p{color:#9fd9b8;font-size:15px;line-height:1.85;margin:0 0 28px}
  .doneBtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .doneBtn{cursor:pointer;font-family:inherit;border-radius:12px;padding:12px 26px;font-size:15px;
    font-weight:600;transition:.2s;border:2px solid #6ee09b;background:transparent;color:#c8ffdd}
  .doneBtn:hover{background:rgba(110,224,155,.2);transform:translateY(-2px)}
  .doneBtn.solid{background:#4fd18b;color:#06210f;border-color:#4fd18b}
  .doneBtn.solid:hover{background:#6ee09b}

  /* ---------- toast ---------- */
  #toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-24px);z-index:60;
    background:rgba(200,60,70,.95);color:#fff;padding:11px 22px;border-radius:12px;font-size:14px;
    font-weight:600;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  #toast.on{opacity:1;transform:translate(-50%,0)}

  @media(max-width:620px){
    #checklist{min-width:0;font-size:11px;padding:9px 11px;max-width:52vw}
    .clItem{font-size:11px}
    #prompt{font-size:13px;padding:9px 16px;bottom:66px}
    #moveHint{font-size:11px}
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<!-- ================= HUD ================= -->
<div id="hud">
  <div id="checklist">
    <div class="clTitle"><span id="clTitleText">打卡清单</span><span id="clCount">0 / 8</span></div>
    <div id="clBarWrap"><div id="clBar"></div></div>
    <div id="clList"></div>
  </div>
  <button id="langBtn">EN</button>
  <div id="moveHint">方向键 / WASD 移动 · 走近建筑按 E 或点击进入</div>
</div>

<div id="prompt"></div>
<div id="toast"></div>

<!-- ================= 语言选择 ================= -->
<div id="langScreen" class="overlay">
  <div class="panel">
    <h2>PLANT CELL CITY</h2>
    <h1 id="lsTitle">🌿 植物细胞之城</h1>
    <p class="sub" id="lsSub">用一座城市，认识植物细胞里的各种细胞器。<br>请选择你想使用的语言：</p>
    <div class="langBtns">
      <button class="langBtn" data-lang="zh"><span class="flag">🇨🇳</span>中文<small>CHINESE</small></button>
      <button class="langBtn" data-lang="en"><span class="flag">🇬🇧</span>English<small>英语</small></button>
    </div>
  </div>
</div>

<!-- ================= 讲解卡片 ================= -->
<div id="cardOverlay" class="overlay hidden">
  <div id="card">
    <div id="cardHead">
      <div class="row">
        <div id="cardEmoji">🏛️</div>
        <div>
          <div id="cardName">—</div>
          <div id="cardTag">—</div>
        </div>
      </div>
      <button id="cardClose">✕</button>
    </div>
    <div id="cardBody">
      <div class="sec">
        <h4 id="hDiagram">🔬 结构示意图 Structure</h4>
        <img id="diagram" alt="organelle image">
      </div>
      <div class="sec">
        <h4 id="hWhy">🎨 为什么像这个建筑</h4>
        <div class="whyBox" id="cardWhy"></div>
      </div>
      <div class="sec">
        <h4 id="hFunc">📖 功能 Function</h4>
        <div class="funcBox"><p id="cardFunc"></p></div>
      </div>
      <div class="sec">
        <h4 id="hAp">🔬 AP 要点</h4>
        <ul id="cardAp"></ul>
      </div>
      <div class="sec">
        <h4 id="hQuiz">📝 AP 小测 Quiz</h4>
        <div id="cardQuiz"></div>
      </div>
      <a id="cardLink" href="#" target="_blank" rel="noopener"></a>
      <div class="extNote" id="extNote"></div>
    </div>
  </div>
</div>

<!-- ================= 通关 ================= -->
<div id="completeScreen" class="overlay hidden">
  <div class="panel">
    <div style="font-size:52px;line-height:1;margin-bottom:14px">🎉</div>
    <h2 id="doneTitle"></h2>
    <p id="doneBody"></p>
    <div class="doneBtns">
      <button class="doneBtn solid" id="againBtn"></button>
      <button class="doneBtn" id="switchBtn"></button>
    </div>
  </div>
</div>

<script>
/* =========================================================================
   植物细胞之城 — 单文件互动网页
   8 个细胞器 · 中英双语 · 点击进楼 · Amoeba Sisters 视频
   ========================================================================= */

/* ---------------------- 1. 文本 / 翻译 ---------------------- */
const T = {
  zh: {
    title: "🌿 植物细胞之城",
    sub: "用一座城市，认识植物细胞里的各种细胞器。<br>请选择你想使用的语言：",
    clTitle: "打卡清单",
    hint: "方向键/WASD 移动 · 走近建筑按空格或点击进入",
    prompt: (n) => `按 <kbd>空格</kbd> 或点击进入：${n}`,
    moveCloser: "走近这座建筑才能进去哦",
    hWhy: "🎨 为什么像这个建筑",
    hDiagram: "🔬 结构示意图 Structure",
    hFunc: "📖 功能 Function",
    hAp: "🔬 AP 要点",
    hQuiz: "📝 AP 小测 Quiz",
    extNote: "链接会打开 YouTube，视频为英文讲解。",
    close: "关闭",
    doneTitle: "恭喜完成植物细胞一日游！",
    doneBody: "你已经认识了这座城市里的核心“部门”。<br>它们分工合作，才让一个植物细胞正常运转。",
    again: "重新游览",
    switch: "切换语言"
  },
  en: {
    title: "🌿 Plant Cell City",
    sub: "Learn the organelles of a plant cell through a city.<br>Choose the language you want to use:",
    clTitle: "Checklist",
    hint: "Move with WASD/Arrows · Space or click to enter",
    prompt: (n) => `Press <kbd>Space</kbd> or click to enter: ${n}`,
    moveCloser: "Walk closer to this building to enter",
    hWhy: "🎨 Why it is like this building",
    hDiagram: "🔬 Structure Diagram",
    hFunc: "📖 Function",
    hAp: "🔬 AP Key Points",
    hQuiz: "📝 AP Quiz",
    extNote: "The link opens YouTube; the video is explained in English.",
    close: "Close",
    doneTitle: "You finished the Plant Cell City tour!",
    doneBody: "You now know the core departments of this city.<br>They work together to keep a plant cell running.",
    again: "Tour again",
    switch: "Switch language"
  }
};

/* ---------------------- 2. 八个细胞器数据 ---------------------- */
const ORG = [
  /* ---------- 1. 细胞核 ---------- */
  {
    id: "nucleus", type: "circle", x: 1300, y: 900, r: 130, emoji: "🏛️",
    video: "https://www.youtube.com/results?search_query=Amoeba+Sisters+cell+nucleus",
    zh: {
      name: "细胞核 Nucleus",
      tag: "「整座城的大脑」",
      why: "它坐在城市正中心，握着整座城的指挥权。所有命令都从这里发出，别的部门都得听它的。",
      func: "细胞核是细胞的指挥中心，储存着遗传物质 DNA（以染色质的形式存在），里面写着制造蛋白质的全部指令。它通过调控基因表达，决定要造什么蛋白质、什么时候造，从而指挥细胞的几乎所有活动。外面包着双层核膜，核膜上开着核孔，让 mRNA、核糖体亚基等物质有选择地进出。核内还有核仁，专门制造核糖体 RNA 并组装核糖体。",
      ap: [
        "双层核膜（nuclear envelope）+ 核孔：选择性运输",
        "核仁（nucleolus）制造 rRNA 并组装核糖体亚基",
        "染色质 = DNA + 组蛋白；分裂时浓缩成染色体",
        "结构对应功能：核孔多 → 物质交换频繁"
      ],
      vLabel: "看 Amoeba Sisters 讲细胞核（英文）"
    },
    en: {
      name: "Nucleus",
      tag: "\u201CThe brain of the city\u201D",
      why: "It sits at the very center of the city and holds command over everything. Every order is issued from here, and every other department answers to it.",
      func: "The nucleus is the command center of the cell. It stores the cell's genetic material, DNA, organized as chromatin, which carries the full set of instructions for building proteins. By regulating gene expression \u2014 deciding which proteins are made and when \u2014 it directs almost all cellular activities. It is enclosed by a double membrane, the nuclear envelope, which is pierced by nuclear pores that allow the selective passage of materials such as mRNA and ribosomal subunits. Inside, the nucleolus makes ribosomal RNA and assembles ribosomal subunits.",
      ap: [
        "Double membrane (nuclear envelope) with nuclear pores for selective transport",
        "Nucleolus makes rRNA and assembles ribosomal subunits",
        "Chromatin = DNA + histone proteins; condenses into chromosomes during division",
        "Structure fits function: many pores \u2192 frequent exchange with the cytoplasm"
      ],
      vLabel: "Watch Amoeba Sisters on the nucleus (English)"
    }
  },

  /* ---------- 2. 叶绿体 ---------- */
  {
    id: "chloroplast", type: "rect", x: 310, y: 260, w: 390, h: 240, emoji: "🌱",
    video: "https://www.youtube.com/results?search_query=Amoeba+Sisters+photosynthesis",
    zh: {
      name: "叶绿体 Chloroplast",
      tag: "「城市边缘的太阳能农场」",
      why: "它建在城墙边、阳光最好的位置，屋顶像一块块太阳能板，把阳光变成整座城市能用的“食物”。",
      func: "叶绿体是光合作用的场所，把光能转变成储存在葡萄糖里的化学能，同时释放氧气。它用叶绿素等色素捕捉阳光，用这些能量把二氧化碳和水合成有机物。叶绿体是双层膜细胞器，内部有许多类囊体堆叠成的基粒（光反应就在类囊体膜上进行），周围是基质，卡尔文循环在基质中固定二氧化碳。叶绿体还自带环状 DNA 和核糖体，是内共生理论的证据，只存在于植物细胞和藻类中。",
      ap: [
        "双层膜 + 类囊体（thylakoid）堆成基粒（grana）+ 基质（stroma）",
        "光反应在类囊体膜上；卡尔文循环在基质中进行",
        "内共生理论：自带环状 DNA 和核糖体，源于被吞入的蓝细菌",
        "植物细胞和藻类特有，动物细胞没有"
      ],
      vLabel: "看 Amoeba Sisters 讲光合作用（英文）"
    },
    en: {
      name: "Chloroplast",
      tag: "\u201CThe solar farm at the edge of the city\u201D",
      why: "It is built along the city wall where the sunlight is strongest, and its roof looks like rows of solar panels that turn light into the food the whole city runs on.",
      func: "The chloroplast is the site of photosynthesis, converting light energy into chemical energy stored in glucose while releasing oxygen. It captures sunlight using pigments, mainly chlorophyll, and uses that energy to build carbohydrates from carbon dioxide and water. It is a double-membraned organelle containing stacks of thylakoids, called grana, where the light reactions occur, surrounded by a fluid stroma where the Calvin cycle fixes CO\u2082 into sugars. Chloroplasts carry their own circular DNA and ribosomes, evidence of their endosymbiotic origin, and are found only in plant cells and algae.",
      ap: [
        "Double membrane + thylakoids stacked into grana + fluid stroma",
        "Light reactions occur on the thylakoid membranes; the Calvin cycle occurs in the stroma",
        "Endosymbiotic theory: own circular DNA and ribosomes, descended from an engulfed cyanobacterium",
        "Found only in plant cells and algae \u2014 absent in animal cells"
      ],
      vLabel: "Watch Amoeba Sisters on photosynthesis (English)"
    }
  },

  /* ---------- 3. 线粒体 ---------- */
  {
    id: "mitochondria", type: "rect", x: 310, y: 660, w: 330, h: 230, emoji: "⚡",
    video: "https://www.youtube.com/results?search_query=Amoeba+Sisters+cellular+respiration",
    zh: {
      name: "线粒体 Mitochondria",
      tag: "「24 小时不停供电的发电厂」",
      why: "城市的每一盏灯、每一台机器都要用电，而线粒体就是那个把燃料烧成电的发电厂——只不过它的“电”是 ATP。",

function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);
  c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r);
  c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r);
  c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}

function mix(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (amt > 0) { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  else { r *= (1 + amt); g *= (1 + amt); b *= (1 + amt); }
  return "rgb(" + Math.round(r) + "," + Math.round(g) + "," + Math.round(b) + ")";
}

const CAN_FILTER = (function () {
  try { ctx.filter = "blur(2px)"; const ok = ctx.filter === "blur(2px)"; ctx.filter = "none"; return ok; }

function footBox(o) {

    : { x0: o.x - o.w / 2, x1: o.x + o.w / 2, y0: o.y - o.h / 2, y1: o.y + o.h / 2 };
}
function baseY(o) { return o.type === "circle" ? o.y + o.r : o.y + o.h / 2; }
function visualTop(o) { return footBox(o).y0 - (H3D[o.id] || 40); }

/* 斜视角墙体：p0/p1 为墙底两个角，pH 为"向上"向量 */
function wallQuad(p0, p1, pH, cBot, cTop) {
  ctx.beginPath();
  ctx.moveTo(p0[0], p0[1]);
  ctx.lineTo(p1[0], p1[1]);
  ctx.lineTo(p1[0] + pH[0], p1[1] + pH[1]);
  ctx.lineTo(p0[0] + pH[0], p0[1] + pH[1]);
  ctx.closePath();
  const g = ctx.createLinearGradient(p0[0], p0[1], p0[0] + pH[0], p0[1] + pH[1]);
  g.addColorStop(0, cBot); g.addColorStop(1, cTop);
  ctx.fillStyle = g; ctx.fill();
}
/* 在墙面上铺一排排窗户 */
function wallWindows(p0, p1, pH, cols, rows, col, colAlt) {
  const wx = p1[0] - p0[0], wy = p1[1] - p0[1];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const lit = colAlt && ((c * 3 + r * 5) % 5 < 2);
      ctx.fillStyle = lit ? colAlt : col;
      const u0 = (c + 0.3) / cols, u1 = (c + 0.7) / cols;
      const v0 = 0.2 + ((r + 0.2) / rows) * 0.62;
      const v1 = 0.2 + ((r + 0.78) / rows) * 0.62;
      const a = [p0[0] + u0 * wx + v0 * pH[0], p0[1] + u0 * wy + v0 * pH[1]];
      const b = [p0[0] + u1 * wx + v0 * pH[0], p0[1] + u1 * wy + v0 * pH[1]];
      const cc = [p0[0] + u1 * wx + v1 * pH[0], p0[1] + u1 * wy + v1 * pH[1]];
      const d = [p0[0] + u0 * wx + v1 * pH[0], p0[1] + u0 * wy + v1 * pH[1]];
      ctx.beginPath();
      ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(cc[0], cc[1]); ctx.lineTo(d[0], d[1]);
      ctx.closePath(); ctx.fill();
    }
  }
}

const OBLIQ = 0.32;
function box3d(x, cyBase, w, h, H, roofHex, sideHex, r, noWin) {
  const dx = H * OBLIQ;
  const fTL = [x - w / 2, cyBase - h], fTR = [x + w / 2, cyBase - h];
  const fBL = [x - w / 2, cyBase],     fBR = [x + w / 2, cyBase];
  const pH = [dx, -H];

  /* 右墙（东面，最暗） */
  wallQuad(fBR, fTR, pH, mix(sideHex, -0.32), mix(sideHex, -0.06));
  /* 前墙（南面） */
  wallQuad(fBL, fBR, pH, mix(sideHex, -0.22), mix(sideHex, 0.16));
  /* 墙面窗户 */
  if (!noWin) {
    const cols = Math.max(2, Math.round(w / 46));
    const rows = Math.max(1, Math.round(H / 30));
    wallWindows(fBL, fBR, pH, cols, rows, "rgba(124,172,214,.62)", "rgba(255,198,110,.88)");
  }
  /* 墙脚接地阴影 */
  ctx.save();
  ctx.globalAlpha = 0.32; ctx.fillStyle = "#000";
  if (CAN_FILTER) ctx.filter = "blur(4px)";
  ctx.fillRect(x - w / 2, cyBase - 5, w + dx, 7);
  ctx.restore();

  /* 屋顶 */
  const rL = x - w / 2 + dx, rT = cyBase - h - H;
  const rg = ctx.createLinearGradient(rL, rT, rL + w, rT + h);
  rg.addColorStop(0, mix(roofHex, 0.24)); rg.addColorStop(1, mix(roofHex, -0.12));
  rr(ctx, rL, rT, w, h, r);
  ctx.fillStyle = rg; ctx.fill();
  /* 女儿墙：屋顶边缘一圈高光/暗边 */
  ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(rL + r, rT + 1.2); ctx.lineTo(rL + w - r, rT + 1.2); ctx.stroke();
  ctx.strokeStyle = "rgba(0,0,0,.2)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(rL + r, rT + h - 1.2); ctx.lineTo(rL + w - r, rT + h - 1.2); ctx.stroke();
  /* 屋顶与墙体的转角高光 */
  ctx.strokeStyle = "rgba(255,255,255,.4)"; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(fTL[0], fTL[1]); ctx.lineTo(fTL[0] + dx, fTL[1] - H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(fTR[0], fTR[1]); ctx.lineTo(fTR[0] + dx, fTR[1] - H); ctx.stroke();

  return { yRoof: rT, yTop: cyBase - H, yBot: cyBase, cx: rL + w / 2, w, h, left: rL, right: rL + w, dx };
}

function cylinder(cx, cyBase, rad, height, ryRatio, topHex, sideHex) {
  const ry = rad * ryRatio;
  const yTop = cyBase - height;
  const sg = ctx.createLinearGradient(cx - rad, 0, cx + rad, 0);
  sg.addColorStop(0, mix(sideHex, -0.28)); sg.addColorStop(0.34, mix(sideHex, 0.18));
  sg.addColorStop(0.62, mix(sideHex, 0.02)); sg.addColorStop(1, mix(sideHex, -0.34));
  ctx.fillStyle = sg;
  ctx.fillRect(cx - rad, yTop, rad * 2, height);
  ctx.beginPath(); ctx.ellipse(cx, cyBase, rad, ry, 0, 0, Math.PI);
  ctx.fillStyle = mix(sideHex, -0.34); ctx.fill();
  const tg = ctx.createRadialGradient(cx - rad * 0.35, yTop - ry * 0.5, rad * 0.08, cx, yTop, rad * 1.15);
  tg.addColorStop(0, mix(topHex, 0.42)); tg.addColorStop(0.65, topHex); tg.addColorStop(1, mix(topHex, -0.2));
  ctx.beginPath(); ctx.ellipse(cx, yTop, rad, ry, 0, 0, TAU);
  ctx.fillStyle = tg; ctx.fill();
  ctx.strokeStyle = "rgba(30,45,70,.3)"; ctx.lineWidth = 1.5; ctx.stroke();
  return yTop;
}

function nearRoad(x, y) {

  for (let j = 1; j < GRID_Y.length - 1; j++) if (Math.abs(y - GRID_Y[j]) < ROAD_W / 2 + 14) return true;
  if (Math.abs(Math.hypot(x - CITY.cx, y - CITY.cy) - RING_R) < 30) return true;
  return false;
}

    const x = WORLD.wall + 70 + rnd() * (WORLD.w - WORLD.wall * 2 - 140);

    let bad = false;
    if (Math.hypot(x - CITY.cx, y - CITY.cy) < CITY.plazaR + 46) bad = true;

function drawHouse(g, x, y, w, h, t) {
  const BODY = ["#d6c2a4", "#d2c3ae", "#c9bfab", "#d4c2a8", "#cebda4", "#dbc7ab"];
  const ROOF = ["#a34a3e", "#7d8a9a", "#8a6b4a", "#5b7a5c", "#9a6a44", "#b06b4a", "#6b7f8f", "#8d5a4a"];
  const body = BODY[Math.floor(t * BODY.length) % BODY.length];
  const roof = ROOF[Math.floor(t * ROOF.length * 1.7) % ROOF.length];
  const H = 16 + t * 16;
  const dx = H * 0.3;
  const cyBase = y + h / 2;
  const fBLx = x - w / 2, fBRx = x + w / 2, fTRy = cyBase - h;

  /* 影子 */
  g.globalAlpha = 0.2; g.fillStyle = "#26301c";
  g.fillRect(fBLx + 5, fTRy + 6, w + dx, h); g.globalAlpha = 1;
  /* 右墙 */
  g.beginPath();
  g.moveTo(fBRx, cyBase); g.lineTo(fBRx, fTRy);
  g.lineTo(fBRx + dx, fTRy - H); g.lineTo(fBRx + dx, cyBase - H);
  g.closePath(); g.fillStyle = mix(body, -0.34); g.fill();
  /* 前墙 */
  g.beginPath();
  g.moveTo(fBLx, cyBase); g.lineTo(fBRx, cyBase);
  g.lineTo(fBRx + dx, cyBase - H); g.lineTo(fBLx + dx, cyBase - H);
  g.closePath(); g.fillStyle = mix(body, -0.12); g.fill();
  /* 窗户 */
  g.fillStyle = "rgba(118,166,214,.62)";
  const cols = Math.max(2, Math.round(w / 22)), rows = Math.max(1, Math.round(H / 20));
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const u0 = (c + 0.3) / cols, u1 = (c + 0.7) / cols;
      const v0 = 0.2 + ((r + 0.22) / rows) * 0.58, v1 = 0.2 + ((r + 0.78) / rows) * 0.58;
      const a = [fBLx + u0 * w + v0 * dx, cyBase + v0 * (-H)];
      const b = [fBLx + u1 * w + v0 * dx, cyBase + v0 * (-H)];
      const cc = [fBLx + u1 * w + v1 * dx, cyBase + v1 * (-H)];
      const d = [fBLx + u0 * w + v1 * dx, cyBase + v1 * (-H)];
      g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.lineTo(cc[0], cc[1]); g.lineTo(d[0], d[1]);
      g.closePath(); g.fill();
    }
  }
  /* 屋顶 */
  const rT = fTRy - H;
  g.fillStyle = mix(roof, 0.14);
  g.fillRect(fBLx + dx, rT, w, h);
  g.fillStyle = "rgba(255,255,255,.35)";
  g.fillRect(fBLx + dx, rT, w, 2.5);
  g.fillStyle = "rgba(0,0,0,.16)";
  g.fillRect(fBLx + dx, rT + h - 2, w, 2);
  /* 烟囱 */
  if (t > 0.62) { g.fillStyle = "#9c8272"; g.fillRect(x + w * 0.18 + dx, rT - 7, 6, 8); }
  /* 屋顶水箱 */
  if (t > 0.78) {
    const tx2 = x + w * 0.68 + dx;
    g.fillStyle = "#7a5c40";
    g.beginPath(); g.ellipse(tx2, rT - 5, 5.5, 4, 0, 0, TAU); g.fill();
    g.fillStyle = "#94734f"; g.fillRect(tx2 - 5.5, rT - 11, 11, 6);
    g.beginPath(); g.ellipse(tx2, rT - 11, 5.5, 4, 0, 0, TAU); g.fill();
  }
}
function drawTower(g, x, y, w, h, t) {
  const H = 66 + t * 34;
  const dx = H * 0.3;
  const cyBase = y + h;

  const r = player.r, wl = WORLD.wall;
  if (x - r < wl || x + r > WORLD.w - wl || y - r < wl || y + r > WORLD.h - wl) return true;
  for (const o of ORG) {
    if (o.roam) continue;
    if (o.type === "circle") { if (Math.hypot(x - o.x, y - o.y) < o.r + r) return true; }
    else if (Math.abs(x - o.x) < o.w / 2 + r && Math.abs(y - o.y) < o.h / 2 + r) return true;
  }
  return false;
}
function moveBy(dx, dy) {
  const steps = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 1.2));
  const sx = dx / steps, sy = dy / steps;
  for (let i = 0; i < steps; i++) {
    if (!collides(player.x + sx, player.y)) player.x += sx;
    if (!collides(player.x, player.y + sy)) player.y += sy;
  }
}
function distTo(o) {
  if (o.type === "circle") return Math.hypot(player.x - o.x, player.y - o.y) - o.r;
  const dx = Math.max(Math.abs(player.x - o.x) - o.w / 2, 0);
  const dy = Math.max(Math.abs(player.y - o.y) - o.h / 2, 0);
  return Math.hypot(dx, dy);
}

const RIBOSOMES = [];
(function () {

      x: WORLD.wall + 90 + rnd() * (WORLD.w - WORLD.wall * 2 - 180),

function updateRibosomes(dt) {
  const k = dt / 16.67, wl = WORLD.wall;
  for (const rb of RIBOSOMES) {
    rb.vx += (rnd() - 0.5) * 0.06; rb.vy += (rnd() - 0.5) * 0.06;
    const sp = Math.hypot(rb.vx, rb.vy);
    if (sp > 1.5) { rb.vx *= 1.5 / sp; rb.vy *= 1.5 / sp; }
    if (sp < 0.3 && sp > 0.001) { rb.vx *= 0.3 / sp; rb.vy *= 0.3 / sp; }
    rb.x += rb.vx * k; rb.y += rb.vy * k;
    if (rb.x < wl + rb.r) { rb.x = wl + rb.r; rb.vx = Math.abs(rb.vx); }
    if (rb.x > WORLD.w - wl - rb.r) { rb.x = WORLD.w - wl - rb.r; rb.vx = -Math.abs(rb.vx); }
    if (rb.y < wl + rb.r) { rb.y = wl + rb.r; rb.vy = Math.abs(rb.vy); }
    if (rb.y > WORLD.h - wl - rb.r) { rb.y = WORLD.h - wl - rb.r; rb.vy = -Math.abs(rb.vy); }
    for (const o of ORG) {
      if (o.roam) continue;
      if (o.type === "circle") {
        const dx = rb.x - o.x, dy = rb.y - o.y, dd = Math.hypot(dx, dy), min = o.r + rb.r;
        if (dd < min && dd > 0.001) { rb.x = o.x + dx / dd * min; rb.y = o.y + dy / dd * min; }
      } else {
        const hx = o.w / 2 + rb.r, hy = o.h / 2 + rb.r;
        if (Math.abs(rb.x - o.x) < hx && Math.abs(rb.y - o.y) < hy) {
          const px = Math.abs(rb.x - o.x) / hx, py = Math.abs(rb.y - o.y) / hy;
          if (px > py) rb.x = o.x + (rb.x > o.x ? hx : -hx); else rb.y = o.y + (rb.y > o.y ? hy : -hy);
        }
      }
    }
  }
}

function coolingTower(cx, cyBase, rBase, height) {
  const rTop = rBase * 0.72, rWaist = rBase * 0.55, yTop = cyBase - height;

  g.addColorStop(0, "#7d8ca6"); g.addColorStop(0.3, "#c6d2e2"); g.addColorStop(0.5, "#aebccf"); g.addColorStop(1, "#6b7a92");

  ctx.bezierCurveTo(cx - rWaist, cyBase - height * 0.5, cx - rWaist, cyBase - height * 0.82, cx - rTop, yTop);
  ctx.lineTo(cx + rTop, yTop);
  ctx.bezierCurveTo(cx + rWaist, cyBase - height * 0.82, cx + rWaist, cyBase - height * 0.5, cx + rBase, cyBase);
  ctx.closePath();
  ctx.fillStyle = g; ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx, cyBase, rBase, rBase * 0.42, 0, 0, Math.PI); ctx.fillStyle = "#6b7a92"; ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx, yTop, rTop, rTop * 0.42, 0, 0, TAU);
  const tg = ctx.createRadialGradient(cx - rTop * 0.3, yTop - rTop * 0.2, 2, cx, yTop, rTop * 1.1);
  tg.addColorStop(0, "#eef3f9"); tg.addColorStop(1, "#9aa8bc"); ctx.fillStyle = tg; ctx.fill();
  ctx.strokeStyle = "rgba(60,80,110,.4)"; ctx.lineWidth = 1.5; ctx.stroke();

    ctx.fillStyle = "#eef2f8"; ctx.fill();

}

function drawRoughER(o) {
  const x = o.x, y = o.y, w = o.w, h = o.h;

    ctx.beginPath(); ctx.moveTo(lx, ry + 10); ctx.lineTo(lx + tw - 4, ry + 10);

  }

    const baseYy = ry + h * 0.56 + i * 20;
    const P0x = p.left + 24, P0y = baseYy, P1x = x - w / 4, P1y = baseYy - 20, P2x = x + w / 4, P2y = baseYy + 20, P3x = p.right - 24, P3y = baseYy;

  for (let i = 0; i < 4; i++) { const sx = p.left + 24 + i * ((w - 48) / 3); cylinder(sx, ry + h * 0.78, 5, 20, 0.6, "#e8e2c8", "#8a7f5c"); }

/* ---- 名牌 ---- */
function drawLabel(o) {
  const L = o[lang];
  const ly = visualTop(o) - 26 - (LABEL_LIFT[o.id] || 0);
  const lx = o.x;
  const active = o.id === activeId;
  ctx.font = "700 16px 'Segoe UI','Microsoft YaHei',sans-serif";
  const txt = o.emoji + "  " + L.name;
  const tw = ctx.measureText(txt).width;
  const padX = 14, hh = 32;
  ctx.save(); ctx.globalAlpha = 0.4; ctx.fillStyle = "#07160d";
  if (CAN_FILTER) ctx.filter = "blur(7px)";
  rr(ctx, lx - tw / 2 - padX + 2, ly - hh / 2 + 5, tw + padX * 2, hh, hh / 2); ctx.fill(); ctx.restore();
  ctx.beginPath(); ctx.moveTo(lx - 7, ly + hh / 2 - 2); ctx.lineTo(lx, ly + hh / 2 + 8); ctx.lineTo(lx + 7, ly + hh / 2 - 2);
  ctx.closePath(); ctx.fillStyle = active ? "rgba(24,78,50,.97)" : "rgba(9,26,17,.94)"; ctx.fill();
  const bg = ctx.createLinearGradient(0, ly - hh / 2, 0, ly + hh / 2);
  bg.addColorStop(0, active ? "rgba(36,104,66,.98)" : "rgba(20,50,34,.95)");
  bg.addColorStop(1, active ? "rgba(18,62,40,.98)" : "rgba(8,24,16,.95)");
  rr(ctx, lx - tw / 2 - padX, ly - hh / 2, tw + padX * 2, hh, hh / 2); ctx.fillStyle = bg; ctx.fill();
  ctx.strokeStyle = active ? "#7cf0a8" : "rgba(122,205,158,.5)";
  ctx.lineWidth = active ? 2.6 : 1.6; ctx.stroke();
  ctx.fillStyle = active ? "#cbffde" : "#e2f7ea";
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(txt, lx, ly + 1);
}
function drawActiveHalo(o, time) {
  const pulse = 0.5 + Math.sin(time * 0.005) * 0.5;
  const b = footBox(o);
  const cxp = (b.x0 + b.x1) / 2, cyp = (b.y0 + b.y1) / 2 + 8;
  const rw = (b.x1 - b.x0) / 2 + 24, rh = (b.y1 - b.y0) / 2 + 22;
  ctx.save(); ctx.globalAlpha = 0.09 + pulse * 0.13; ctx.fillStyle = "#7cf0a8";
  if (CAN_FILTER) ctx.filter = "blur(18px)";
  ctx.beginPath(); ctx.ellipse(cxp, cyp, rw, rh, 0, 0, TAU); ctx.fill(); ctx.restore();
  ctx.save(); ctx.globalAlpha = 0.35 + pulse * 0.5; ctx.strokeStyle = "#6ee09b"; ctx.lineWidth = 4;
  ctx.setLineDash([14, 10]); ctx.lineDashOffset = -time * 0.03;
  ctx.beginPath(); ctx.ellipse(cxp, cyp, rw, rh, 0, 0, TAU); ctx.stroke(); ctx.restore();
}

/* ---- 主角 ---- */
function drawPlayer() {
  const bob = player.moved ? Math.sin(player.t) * 3.4 : 0;
  const px = player.x, py = player.y + bob;
  const sq = player.moved ? 1 + Math.sin(player.t * 2) * 0.05 : 1;
  ctx.save(); ctx.globalAlpha = 0.34; ctx.fillStyle = "#0f1e0a";
  if (CAN_FILTER) ctx.filter = "blur(5px)";
  ctx.beginPath(); ctx.ellipse(player.x + 5, player.y + 16, 15 * sq, 6, 0, 0, TAU); ctx.fill(); ctx.restore();
  const g = ctx.createRadialGradient(px - 7, py - 9, 2, px, py, player.r + 5);
  g.addColorStop(0, "#ffd6da"); g.addColorStop(0.32, "#ff8b95"); g.addColorStop(0.75, "#ea4a58"); g.addColorStop(1, "#c21f2e");
  ctx.beginPath(); ctx.ellipse(px, py, player.r * sq, player.r / sq, 0, 0, TAU); ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = "rgba(126,16,28,.7)"; ctx.lineWidth = 2; ctx.stroke();
  ctx.save(); ctx.globalAlpha = 0.6; ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.ellipse(px - 6, py - 8, 4.8, 3.2, -0.6, 0, TAU); ctx.fill(); ctx.restore();
  const d = player.faceX >= 0 ? 1 : -1;
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.ellipse(px - 5.6 * d, py - 3.6, 4.2, 4.6, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(px + 5.6 * d, py - 3.6, 4.2, 4.6, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = "#26303a";
  ctx.beginPath(); ctx.arc(px - 4.9 * d + d * 1.4, py - 3.4, 2.1, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(px + 6.3 * d + d * 1.4, py - 3.4, 2.1, 0, TAU); ctx.fill();
  ctx.strokeStyle = "#7a1f28"; ctx.lineWidth = 1.9; ctx.lineCap = "round";
  ctx.beginPath(); ctx.arc(px, py + 3.6, 5.2, 0.18 * Math.PI, 0.82 * Math.PI); ctx.stroke();
}

/* ---- 主循环 ---- */
let lastT = performance.now();
function frame(now) {
  const time = now;
  const dt = Math.min(40, now - lastT); lastT = now;
  if (!cardOpen) {
    let dx = 0, dy = 0;
    if (keys["arrowleft"] || keys["a"]) dx -= 1;
    if (keys["arrowright"] || keys["d"]) dx += 1;
    if (keys["arrowup"] || keys["w"]) dy -= 1;
    if (keys["arrowdown"] || keys["s"]) dy += 1;
    if (dx || dy) {
      const len = Math.hypot(dx, dy), sp = 4.6 * (dt / 16.67);
      moveBy((dx / len) * sp, (dy / len) * sp);
      player.t += 0.26; player.moved = true; if (dx) player.faceX = dx;
    } else player.moved = false;
  } else player.moved = false;
  updateRibosomes(dt);
  updateCars(dt);

  const camX = view.w >= WORLD.w ? (WORLD.w - view.w) / 2 : clamp(player.x - view.w / 2, 0, WORLD.w - view.w);
  const camY = view.h >= WORLD.h ? (WORLD.h - view.h) / 2 : clamp(player.y - view.h / 2, 0, WORLD.h - view.h);
  cam.x += (camX - cam.x) * 0.16;
  cam.y += (camY - cam.y) * 0.16;

  const actOrg = cardOpen ? null : findActive();
  const actRibo = cardOpen ? null : nearestRibo();
  activeRiboDot = actOrg ? null : actRibo;
  const act = actOrg || (actRibo ? ORG.find(x => x.id === "ribosome") : null);
  const newId = act ? act.id : null;
  if (newId !== activeId) { activeId = newId; updatePrompt(act); }

  const dpr = window.devicePixelRatio || 1;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#0a1410";
  ctx.fillRect(0, 0, view.w, view.h);

  ctx.save();
  ctx.translate(-cam.x, -cam.y);
  ctx.fillStyle = "#22331f";
  ctx.fillRect(0, 0, WORLD.w, WORLD.h);
  ctx.drawImage(groundCv, 0, 0);
  for (const c of CARS) drawCar(c);
  drawFountains(time);
  drawParticles(time);
  for (const o of ORG) if (o.id === activeId && !o.roam) drawActiveHalo(o, time);

  const items = [];
  for (const o of ORG) if (!o.roam) items.push({ z: o.y + (o.type === "circle" ? o.r : o.h / 2), kind: "org", o });
  items.push({ z: player.y, kind: "player" });
  for (const rb of RIBOSOMES) items.push({ z: rb.y, kind: "ribo", rb });
  items.sort((a, b) => a.z - b.z);
  for (const it of items) {
    if (it.kind === "org") drawBuildingShape(it.o);
    else if (it.kind === "player") drawPlayer();
    else drawRibosomeDot(it.rb, time, it.rb === activeRiboDot);
  }

  for (const o of ORG) if (!o.roam) drawLabel(o);
  ctx.restore();

  const lg = ctx.createLinearGradient(0, 0, view.w, view.h);
  lg.addColorStop(0, "rgba(255,250,215,.10)"); lg.addColorStop(0.5, "rgba(255,255,255,0)"); lg.addColorStop(1, "rgba(16,38,24,.16)");
  ctx.fillStyle = lg; ctx.fillRect(0, 0, view.w, view.h);
  const vg = ctx.createRadialGradient(view.w / 2, view.h / 2, Math.min(view.w, view.h) * 0.34, view.w / 2, view.h / 2, Math.max(view.w, view.h) * 0.76);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(5,14,9,.46)");
  ctx.fillStyle = vg; ctx.fillRect(0, 0, view.w, view.h);

  requestAnimationFrame(frame);
}

function updatePrompt(o) {
  if (!o) { promptEl.classList.remove("on"); return; }
  promptEl.innerHTML = T[lang].prompt(o[lang].name);
  promptEl.classList.add("on");
}

let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("on"), 1600);
}

function buildChecklist() {
  clTitleText.textContent = T[lang].clTitle;
  clList.innerHTML = "";
  for (const o of ORG) {
    const d = document.createElement("div");
    d.className = "clItem" + (visited.has(o.id) ? " on" : "");
    d.dataset.id = o.id;
    d.innerHTML = '<span class="tick">' + (visited.has(o.id) ? "✅" : "⬜") + "</span><span>" + o.emoji + " " + o[lang].name + "</span>";
    clList.appendChild(d);
  }
  clCount.textContent = visited.size + " / " + ORG.length;
  clBar.style.width = (visited.size / ORG.length * 100) + "%";
}

function refreshChecklist() {
  for (const d of clList.children) {
    const on = visited.has(d.dataset.id);
    d.classList.toggle("on", on);
    d.querySelector(".tick").textContent = on ? "✅" : "⬜";
    const o = ORG.find(x => x.id === d.dataset.id);
    d.lastChild.textContent = o.emoji + " " + o[lang].name;
  }
  clCount.textContent = visited.size + " / " + ORG.length;
  clBar.style.width = (visited.size / ORG.length * 100) + "%";
}

  dg.save(); dg.translate(cx, cy); dg.rotate(-0.5);
  dg.fillStyle = "#7fb8d8"; dg.fillRect(-14, -14, 28, 28);
  dg.strokeStyle = "#3f7a9c"; dg.lineWidth = 1.6; dg.strokeRect(-14, -14, 28, 28);
  dg.restore();
  dL(cx, cy + 96, "Enzymes + catalase");
}

function diagramCytoskeleton() {
  const cx = 230, cy = 112;
  dg.lineCap = "round";
  dg.strokeStyle = "#c0392b"; dg.lineWidth = 5;
  dg.beginPath(); dg.moveTo(cx - 130, cy - 40); dg.quadraticCurveTo(cx, cy, cx + 130, cy + 40); dg.stroke();
  dg.strokeStyle = "#2980b9"; dg.lineWidth = 4;
  dg.beginPath(); dg.moveTo(cx - 130, cy + 40); dg.quadraticCurveTo(cx, cy, cx + 130, cy - 40); dg.stroke();
  dg.strokeStyle = "#7f8c8d"; dg.lineWidth = 2.4;
  dg.beginPath(); dg.moveTo(cx, cy - 82); dg.lineTo(cx, cy + 82); dg.stroke();
  dL(cx, cy + 96, "Microtubules · Microfilaments · Intermediate filaments");
}

function diagramMembrane() {
  const cx = 230, cy = 112;
  for (let i = 0; i < 12; i++) {
    const x = 60 + i * 34;
    dCircle(x, cy - 18, 7, "#6fb0d9", "#4f8fb8");
    dCircle(x, cy + 18, 7, "#6fb0d9", "#4f8fb8");
    dg.strokeStyle = "#9cc4de"; dg.lineWidth = 2.4;
    dg.beginPath(); dg.moveTo(x, cy - 11); dg.lineTo(x, cy + 11); dg.stroke();
  }
  dg.fillStyle = "#e0a54f";
  dg.beginPath(); dg.ellipse(cx + 128, cy, 16, 34, 0, 0, TAU); dg.fill();
  dg.strokeStyle = "#a86f2a"; dg.lineWidth = 1.8; dg.stroke();
  dL(cx - 30, cy - 36, "Phospholipid bilayer");
  dL(cx + 128, cy + 48, "Membrane protein");
}

function renderQuiz(id) {
  const qz = QUIZZES[id];
  const box = document.getElementById("cardQuiz");
  if (!qz) { box.innerHTML = ""; return; }
  const q = qz[lang];
  let html = '<p id="quizQ">' + q.q + "</p><div id='quizOpts'>";
  for (let i = 0; i < q.o.length; i++) {
    html += '<button class="quizOpt" data-i="' + i + '"><b>' + String.fromCharCode(65 + i) + ".</b> " + q.o[i] + "</button>";
  }
  html += "</div><div id='quizFeedback'></div>";
  box.innerHTML = html;
  box.querySelectorAll(".quizOpt").forEach(btn => {
    btn.addEventListener("click", () => answerQuiz(box, q, btn));
  });
}

function answerQuiz(box, q, btn) {
  const i = parseInt(btn.dataset.i, 10);
  const opts = box.querySelectorAll(".quizOpt");
  opts.forEach(o => o.classList.add("disabled"));
  const fb = box.querySelector("#quizFeedback");
  if (i === q.a) {
    btn.classList.add("correct");
    fb.className = "correct";
    fb.textContent = "✅ " + (lang === "zh" ? "正确！" : "Correct!") + "  " + q.e;
  } else {
    btn.classList.add("wrong");
    opts[q.a].classList.add("correct");
    fb.className = "wrong";
    fb.textContent = "❌ " + (lang === "zh" ? "不对哦。" : "Not quite.") + "  " + q.e;
  }
}

function fillCard(o) {
  const L = o[lang], t = T[lang];
  cardEmoji.textContent = o.emoji;
  cardName.textContent = L.name;
  cardTag.textContent = L.tag;
  cardWhy.textContent = L.why;
  cardFunc.textContent = L.func;
  cardAp.innerHTML = L.ap.map(p => "<li>" + p + "</li>").join("");
  cardLink.href = o.video;
  cardLink.textContent = "▶ " + L.vLabel;
  document.getElementById("hWhy").textContent = t.hWhy;
  document.getElementById("hDiagram").textContent = t.hDiagram;
  document.getElementById("hFunc").textContent = t.hFunc;
  document.getElementById("hAp").textContent = t.hAp;
  document.getElementById("hQuiz").textContent = t.hQuiz;
  extNote.textContent = t.extNote;
  diagramImg.src = ORG_IMG[o.id] || "";
  renderQuiz(o.id);
}

function openCard(o) {
  currentOrg = o;
  cardOpen = true;
  fillCard(o);
  cardOverlay.classList.remove("hidden");
  cardOverlay.scrollTop = 0;
  document.getElementById("card").scrollTop = 0;
  if (!visited.has(o.id)) { visited.add(o.id); refreshChecklist(); }
  promptEl.classList.remove("on");
  activeId = null;   /* 关掉卡片后能让提示重新出现 */
}

function closeCard() {
  cardOpen = false;
  currentOrg = null;
  cardOverlay.classList.add("hidden");
  if (visited.size === ORG.length && !completed) {
    completed = true;
    showComplete();
  }
}

document.getElementById("cardClose").addEventListener("click", closeCard);
cardOverlay.addEventListener("click", e => { if (e.target === cardOverlay) closeCard(); });

/* --- 通关 --- */
const completeScreen = document.getElementById("completeScreen");
function showComplete() {
  document.getElementById("doneTitle").textContent = T[lang].doneTitle;
  document.getElementById("doneBody").innerHTML = T[lang].doneBody;
  document.getElementById("againBtn").textContent = T[lang].again;
  document.getElementById("switchBtn").textContent = T[lang].switch;
  completeScreen.classList.remove("hidden");
}
document.getElementById("againBtn").addEventListener("click", () => {
  visited.clear(); completed = false;
  refreshChecklist();
  completeScreen.classList.add("hidden");
  player.x = 1300; player.y = 560;
});
document.getElementById("switchBtn").addEventListener("click", () => {
  completeScreen.classList.add("hidden");
  document.getElementById("langScreen").classList.remove("hidden");
});

/* --- 语言 --- */
function setLang(l, fromStart) {
  lang = l;
  document.documentElement.lang = l === "zh" ? "zh" : "en";
  const t = T[lang];
  document.getElementById("langBtn").textContent = l === "zh" ? "EN" : "中文";
  document.getElementById("moveHint").textContent = t.hint;
  document.getElementById("lsTitle").textContent = t.title;
  document.getElementById("lsSub").innerHTML = t.sub;
  clTitleText.textContent = t.clTitle;
  buildChecklist();
  if (currentOrg && cardOpen) fillCard(currentOrg);
  if (!fromStart) { activeId = null; updatePrompt(null); }
  if (!completeScreen.classList.contains("hidden")) showComplete();
}

document.querySelectorAll(".langBtn").forEach(b => {
  b.addEventListener("click", () => {
    setLang(b.dataset.lang, true);
    document.getElementById("langScreen").classList.add("hidden");
  });
});
document.getElementById("langBtn").addEventListener("click", () => {
  setLang(lang === "zh" ? "en" : "zh", false);
});

/* --- 输入 --- */
window.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === "escape" && cardOpen) closeCard();
  if (k === " " && !cardOpen) {
    const a = ORG.find(o => o.id === activeId);
    if (a) openCard(a);
  }
  if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(k)) e.preventDefault();
});
window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

cv.addEventListener("click", e => {
  if (cardOpen) return;
  if (!document.getElementById("langScreen").classList.contains("hidden")) return;
  if (!completeScreen.classList.contains("hidden")) return;
  const rect = cv.getBoundingClientRect();
  const wx = e.clientX - rect.left + cam.x;
  const wy = e.clientY - rect.top + cam.y;
  const hit = pointInOrg(wx, wy);
  if (hit) {
    if (distTo(hit) < REACH) openCard(hit);
    else toast(T[lang].moveCloser);
    return;
  }
  if (pointInRibo(wx, wy)) {
    openCard(ORG.find(x => x.id === "ribosome"));
  }
});

/* --- 尺寸 --- */
function resize() {
  const dpr = window.devicePixelRatio || 1;
  view.w = window.innerWidth;
  view.h = window.innerHeight;
  cv.width = Math.floor(view.w * dpr);
  cv.height = Math.floor(view.h * dpr);
  cv.style.width = view.w + "px";
  cv.style.height = view.h + "px";
}
window.addEventListener("resize", resize);

/* --- 启动 --- */
resize();
setLang("zh", true);
requestAnimationFrame(frame);
</script>
